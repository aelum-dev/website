# GitLab Pages CI/CD pipeline for AestheticOS-Web
# Deployed to: https://<username>.gitlab.io/AestheticOS-Web/

image: node:22-bookworm

pages:
  stage: deploy
  cache:
    key:
      files:
        - package-lock.json
      prefix: npm
    paths:
      - .npm/
      - node_modules/

  before_script:
    - npm ci --cache .npm --prefer-offline || npm ci

  script:
    - npm run build
    - mkdir -p public
    - cp -r dist/* public/ # merge build output into public/

  artifacts:
    paths:
      - public

  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "pipeline"

  environment:
    name: gitlab-pages
    url: https://aestheticos.gitlab.io/website/
