<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf7f6"/>
      <stop offset="1" stop-color="#f0e7e2"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a67480"/>
      <stop offset="0.55" stop-color="#8e7579"/>
      <stop offset="1" stop-color="#a08864"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- decorative blobs -->
  <circle cx="1050" cy="80" r="180" fill="#a67480" opacity="0.16" filter="url(#soft)"/>
  <circle cx="150" cy="560" r="200" fill="#a08864" opacity="0.16" filter="url(#soft)"/>

  <!-- brand star -->
  <g transform="translate(960 150) scale(1.1)">
    <path d="M40 0 L48 30 L80 30 L54 48 L62 78 L40 58 L18 78 L26 48 L0 30 L32 30 Z" fill="url(#grad)" opacity="0.9"/>
  </g>

  <!-- headline -->
  <text x="80" y="160" font-size="92" font-weight="800" fill="#3d3234">AestheticOS</text>
  <text x="82" y="238" font-size="40" fill="#756567">Beautiful, fully offline Arch Linux</text>
  <text x="82" y="292" font-size="30" fill="#9a8a8c">Boot the ISO · run the installer · polished Hyprland desktop</text>

  <!-- chip -->
  <g transform="translate(82 330)">
    <rect width="232" height="58" rx="29" fill="url(#grad)"/>
    <text x="116" y="38" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">Fully offline, ever</text>
  </g>
</svg>
