<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf7f6"/>
      <stop offset="1" stop-color="#f0e7e2"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a67480"/>
      <stop offset="0.55" stop-color="#8e7579"/>
      <stop offset="1" stop-color="#a08864"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="badgeclip">
      <rect x="0" y="0" width="210" height="210" rx="48" ry="48"/>
    </clipPath>
  </defs>

  <style>
    @font-face {
      font-family: 'Nunito';
      src: url('nunito.woff2');
    }
    .gradient-text { fill: url(#grad); }
  </style>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- decorative blobs -->
  <circle cx="1050" cy="80" r="180" fill="#a67480" opacity="0.16" filter="url(#soft)"/>
  <circle cx="150" cy="560" r="200" fill="#a08864" opacity="0.16" filter="url(#soft)"/>

  <!-- brand logo badge (rounded "A") -->
  <g transform="translate(895 255)" clip-path="url(#badgeclip)">
    <image href="logo.png" x="0" y="0" width="210" height="210"/>
  </g>

  <!-- headline -->
  <text x="80" y="165" font-size="94" font-weight="800" fill="#3d3234">AestheticOS</text>
  <text x="82" y="236" font-size="42" font-weight="800" class="gradient-text">Beautifully themed Arch-based distro</text>
  <text x="82" y="288" font-size="26" fill="#9a8a8c">Polished Hyprland desktop with DankMaterialShell</text>

  <!-- chip -->
  <g transform="translate(82 326)">
    <rect width="248" height="60" rx="30" fill="url(#grad)"/>
    <text x="124" y="39" text-anchor="middle" font-size="27" font-weight="700" fill="#fff">Fully offline, ever</text>
  </g>
</svg>
