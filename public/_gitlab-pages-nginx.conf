# Custom nginx configuration for GitLab Pages.
#
# Long-lived immutable caching for content-hashed static assets. When an
# asset's content changes, its filename changes too (see public/images), so
# this safe year-long cache never serves a stale screenshot.
#
# GitLab Pages reads this file (unlike a Netlify `_headers` file, which it
# ignores). Match the deployed base path (/website/) explicitly.
location ~* ^/website/images/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}
